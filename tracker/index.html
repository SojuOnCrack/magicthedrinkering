<style>
  html, body {
    margin: 0; padding: 0;
    background: #06090f;
    overflow-x: hidden;
    min-height: 100%;
    width: 100%;
  }

  *, *::before, *::after { box-sizing: border-box; }

  button, input, select {
    font: inherit;
  }

  button {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  #mp-root {
    min-height: 100dvh;
  }

  #mp-root > div[style] {
    display: none !important;
  }

  .mp-live {
    min-height: 100dvh;
    height: auto;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .mp-strip-meta {
    min-width: 0;
  }

  .mp-active-label,
  .mp-my-name,
  .mp-my-deck,
  .mp-combat-name,
  .mp-combat-deck {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mp-lbtn,
  .mp-mini-btn,
  .mp-cmd-btn,
  .mp-toggle-btn,
  .mp-counter-toggle,
  .mp-combat-shortcut,
  .mp-combat-target-pill,
  .mp-pass-btn,
  .mp-undo-btn,
  .mp-back-btn,
  .mp-copy-btn {
    min-height: 44px;
  }

  .mp-life-number {
    letter-spacing: 0;
  }

  .mp-combat-modal-body {
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .mp-splash {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 50% 18%, rgba(201,168,76,.16), transparent 34rem),
      linear-gradient(180deg, #090d15 0%, #05070c 100%);
    color: #e8e0d0;
  }

  .mp-splash-inner {
    width: min(100%, 360px);
    display: grid;
    justify-items: center;
    gap: 1rem;
    text-align: center;
  }

  .mp-splash-mark {
    width: 76px;
    height: 76px;
    position: relative;
    display: grid;
    place-items: center;
    border: 1px solid rgba(201,168,76,.32);
    border-radius: 50%;
    background: rgba(255,255,255,.035);
    box-shadow: 0 18px 54px rgba(0,0,0,.36), inset 0 0 28px rgba(201,168,76,.08);
  }

  .mp-splash-mark::before,
  .mp-splash-mark::after {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: inherit;
    border: 1px solid transparent;
    border-top-color: rgba(201,168,76,.72);
    animation: mp-splash-spin 1.4s linear infinite;
  }

  .mp-splash-mark::after {
    inset: 7px;
    border-top-color: rgba(126,200,227,.56);
    animation-duration: 1.9s;
    animation-direction: reverse;
  }

  .mp-splash-glyph {
    font-family: 'Cinzel', serif;
    font-size: 1.35rem;
    font-weight: 900;
    color: #c9a84c;
    letter-spacing: 0;
  }

  .mp-splash-logo {
    width: 42px;
    height: 42px;
    display: block;
    object-fit: contain;
    border-radius: 12px;
  }

  .mp-logo,
  .mp-logo-sm {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .mp-logo-icon {
    width: 72px;
    height: 72px;
    display: block;
    object-fit: contain;
    border-radius: 18px;
    flex: 0 0 auto;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
  }

  .mp-logo-sm .mp-logo-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
  }

  .mp-splash-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.35rem, 7vw, 2rem);
    font-weight: 700;
    line-height: 1.05;
    color: #f0e5cf;
  }

  .mp-splash-title em {
    color: #c9a84c;
    font-style: normal;
  }

  .mp-splash-status {
    min-height: 1.35em;
    color: rgba(232,224,208,.62);
    font-size: .95rem;
    line-height: 1.35;
  }

  .mp-splash-bar {
    width: min(220px, 72vw);
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
  }

  .mp-splash-bar::before {
    content: "";
    display: block;
    width: 45%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, #c9a84c, #7ec8e3, transparent);
    animation: mp-splash-load 1.25s ease-in-out infinite;
  }

  @keyframes mp-splash-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes mp-splash-load {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(250%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .mp-splash-mark::before,
    .mp-splash-mark::after,
    .mp-splash-bar::before {
      animation: none;
    }
  }

  @media (max-width: 760px) {
    #mp-root,
    .mp-screen,
    .mp-live {
      height: auto;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .mp-top-strip {
      padding: calc(.45rem + env(safe-area-inset-top)) .65rem .55rem;
    }

    .mp-strip-meta {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: .4rem;
    }

    .mp-undo-btn {
      grid-column: 1 / -1;
      width: 100%;
    }

    .mp-other-players {
      grid-auto-columns: minmax(136px, 42vw);
      gap: .45rem;
      scroll-snap-type: x proximity;
    }

    .mp-other-card {
      min-width: 0;
      min-height: 72px;
      scroll-snap-align: start;
    }

    .mp-my-card {
      overflow: visible;
    }

    .mp-my-card-inner {
      height: auto;
      overflow: visible;
      padding: .85rem .75rem calc(1rem + env(safe-area-inset-bottom));
      gap: .75rem;
    }

    .mp-my-header {
      flex-direction: column;
      align-items: stretch;
    }

    .mp-my-badges {
      justify-content: flex-start;
      margin-left: 0;
    }

    .mp-live-grid {
      grid-template-columns: 1fr;
      gap: .65rem;
    }

    .mp-life-control-groups,
    .mp-utility-grid,
    .mp-utility-grid-tight {
      grid-template-columns: 1fr;
    }

    .mp-life-controls {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: .35rem;
    }

    .mp-life-number {
      font-size: clamp(4rem, 28vw, 6rem);
    }

    .mp-toggle-stack {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .mp-pass-btn-inline {
      grid-column: 1 / -1;
    }

    .mp-counter-drawer {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .mp-arena-launcher {
      align-items: stretch;
    }

    .mp-combat-shortcuts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .mp-combat-modal-backdrop {
      align-items: flex-end;
      padding: .55rem;
    }

    .mp-combat-modal {
      width: 100%;
      max-height: min(88dvh, 720px);
      border-radius: 16px 16px 0 0;
      padding: .8rem;
    }
  }

  @media (max-width: 380px) {
    .mp-strip-meta,
    .mp-counter-drawer,
    .mp-combat-shortcuts,
    .mp-toggle-stack {
      grid-template-columns: 1fr;
    }

    .mp-life-controls {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .mp-life-number {
      font-size: clamp(3.5rem, 30vw, 5rem);
    }
  }
</style>
</head>
<body>

<!-- Multiplayer Root – hier rendert der JS alles rein -->
<div id="mp-root">
  <div class="mp-splash" role="status" aria-live="polite">
    <div class="mp-splash-inner">
      <div class="mp-splash-mark" aria-hidden="true">
        <img class="mp-splash-logo" src="/favicon.svg" alt="">
      </div>
      <div class="mp-splash-title">MagicThe<em>Drinkering</em></div>
      <div class="mp-splash-status">Lade Commander Tracker...</div>
      <div class="mp-splash-bar" aria-hidden="true"></div>
    </div>
  </div>
  <!-- Ladescreen bis JS ready ist -->
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#06090f;">
    <div style="text-align:center;">
      <div style="width:32px;height:32px;border:2px solid rgba(201,168,76,.2);border-top-color:#c9a84c;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem;"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      <div style="color:rgba(232,224,208,.3);font-family:serif;font-size:.9rem;">Lade Tracker…</div>
    </div>
  </div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- Multiplayer Tracker -->
<script src="/js/tracker.js?v=202605020500"></script>

</body>
</html>
